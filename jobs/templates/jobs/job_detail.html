{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>{{ job.title }}</h2>
    <p><strong>Company:</strong> {{ job.company.company_name }}</p>
    <p><strong>Location:</strong> {{ job.location }}</p>
    <p><strong>Skills Required:</strong> {{ job.skills_required }}</p>
    <p>{{ job.description }}</p>
    <a href="{% url 'apply_job' job.id %}" class="btn btn-success">Apply Now</a>
</div>
{% endblock %}
