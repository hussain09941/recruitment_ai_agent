{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <meta charset="UTF-8">
    <title>Recruitment Agent AI</title>

    <!-- 🌿 Internal CSS -->
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: #2b5797;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 a {
            color: white;
            text-decoration: none;
        }

        nav a {
            color: white;
            margin-left: 15px;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        nav a:hover {
            background: #1a3d73;
        }

        /* Sidebar */
        .main-wrapper {
            display: flex;
        }

        .sidebar {
            width: 200px;
            background: #f1f1f1;
            padding-top: 20px;
            position: fixed;
            height: 100%;
        }

        .sidebar ul {
            list-style-type: none;
            padding: 0;
        }

        .sidebar ul li {
            margin: 10px 0;
        }

        .sidebar ul li a {
            text-decoration: none;
            color: #333;
            display: block;
            padding: 10px 20px;
            transition: all 0.3s;
        }

        .sidebar ul li a:hover {
            background-color: #2b5797;
            color: white;
            border-radius: 5px;
        }

        /* Main container */
        .container {
            margin-left: 220px; /* space for sidebar */
            padding: 20px;
            flex: 1;
        }
    </style>

</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>



<header>
    <h1><a href="{% url 'home' %}">Sentiment AI(Recruiter)</a></h1>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        {% if user.is_authenticated %}
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'register' %}">Register</a>
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>
</header>

<div class="main-wrapper">
    <!-- Floating Sidebar -->
    <aside class="sidebar">
        <ul>
            <li><a href="{% url 'home' %}">Dashboard</a></li>
            <li><a href="{% url 'job_list' %}">Jobs</a></li>

           <li><a href="{% url 'login' %}">Candidates</a></li>

            <li><a href="#">Reports</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</div>

</body>
</html>
